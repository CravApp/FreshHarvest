name: Build iOS IPA (sin firma)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Compilar Archive sin firma
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FreshHarvest.xcodeproj \
            -scheme FreshHarvest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FreshHarvest.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Empaquetar .ipa (Payload)
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R FreshHarvest.xcarchive/Products/Applications/*.app Payload/
          zip -qry FreshHarvest_Unsigned.ipa Payload
          ls -lh FreshHarvest_Unsigned.ipa

      - name: Subir artefacto .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FreshHarvest-ipa-unsigned
          path: ${{ runner.temp }}/FreshHarvest_Unsigned.ipa
          if-no-files-found: error

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
