name: Build Unsigned iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    runs-on: macos-14

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar versión de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Compilar Archive sin firma de código
        run: |
          # Reemplaza TuProyecto.xcodeproj y TuScheme por los datos de tu proyecto
          # Si usas CocoaPods o SPM Workspace, cambia '-project ...' por '-workspace TuProyecto.xcworkspace'
          xcodebuild archive \
            -project FreshHarvest.xcodeproj \
            -scheme TuScheme \
            -configuration Release \
            -archivePath $RUNNER_TEMP/TuProyecto.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar ejecutable .app en archivo .ipa (Payload)
        run: |
          # 1. Crear estructura estándar de empaquetado iOS
          mkdir -p $RUNNER_TEMP/Payload
          
          # 2. Copiar el archivo .app dentro de Payload
          cp -r $RUNNER_TEMP/TuProyecto.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          
          # 3. Comprimir la carpeta Payload como un archivo .ipa
          cd $RUNNER_TEMP
          zip -r TuProyecto_Unsigned.ipa Payload

      - name: Subir artefacto (.ipa) a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-unsigned
          path: ${{ runner.temp }}/TuProyecto_Unsigned.ipa
